services:
  - type: web
    name: fastapi-basic-app
    runtime: python
    region: virginia
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./database.db
      - key: RENDER
        value: true
    healthCheckPath: /health
    autoDeploy: true